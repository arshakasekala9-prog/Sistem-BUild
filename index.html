<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistem Hunter</title>
<style>
:root{--bg:#050914;--card:#0b1328;--tx:#dbe8ff;--mu:#7f93b8;--ac:#3b9bff;--bd:#1c3766;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:16px;margin-bottom:14px;box-shadow:0 0 16px rgba(59,155,255,.15),inset 0 0 12px rgba(59,155,255,.05)}
.card h2{color:var(--ac);text-transform:uppercase;letter-spacing:.12em;font-size:13px}
.big{text-shadow:0 0 12px var(--ac)}.bar i{box-shadow:0 0 10px var(--ac)}
h1{letter-spacing:.04em;text-shadow:0 0 10px rgba(59,155,255,.6)}
body{background:radial-gradient(circle at 50% -10%,#10245a 0,var(--bg) 55%) fixed,var(--bg)}
h1{font-size:22px;margin:8px 0 14px}h2{font-size:16px;margin:0 0 10px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font-size:15px}
button{background:var(--ac);color:#fff;border:0;border-radius:9px;padding:10px 14px;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px}
button.g{background:transparent;color:var(--mu);border:1px solid var(--bd);margin-top:0;padding:6px 10px;font-size:12px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.row>*{flex:1}.row>button{flex:0 0 auto}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}
.item:first-of-type{border-top:0}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ac);transition:width .4s}
.mu{color:var(--mu);font-size:13px}.big{font-size:26px;font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd);margin:0}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tag{font-size:12px;background:var(--ac);color:#fff;border-radius:20px;padding:2px 9px}
.off{opacity:.45}
.ti{width:44px;height:58px;object-fit:cover;object-position:top;border-radius:6px;flex:0 0 auto}
.ti.e{display:flex;align-items:center;justify-content:center;font-size:22px}
.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0}
.pg button{background:var(--bg);border:1px solid var(--bd);padding:4px;margin:0;color:var(--tx);font-size:11px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px}
.pg button.on{border-color:var(--ac);box-shadow:0 0 10px var(--ac)}
.pg .ti{width:100%;height:auto;aspect-ratio:3/4;object-position:center}

let selIc="";
const EM={};
const im=(k,c)=>k&&IC[k]?`<img class="${c||"ti"}" src="${IC[k]}" alt="">`:`<span class="${c||"ti"} e">${EM[k]||"🏅"}</span>`;
const px=p=>(p.t=="r"?p.sets*p.reps:p.min)*(p.m||1);
const pl=p=>p.t=="r"?`${p.sets} set × ${p.reps} reps`:`${p.min} menit`;
const LV=[["E-Rank Hunter",0],["D-Rank Hunter",500],["C-Rank Hunter",1500],["B-Rank Hunter",3500],["A-Rank Hunter",7000],["S-Rank Hunter",12000],["National Level Hunter",20000]];
const INT=[["Ringan",1],["Sedang",2],["Berat",3],["Ekstrem",4]];
const PRE=[["Dumbbell Curl",1,"curl","r"],["Shoulder Press",2,"press","r"],["Treadmill",1,"treadmill","t"],["Triceps",1,"triceps","r"],["Push Up",2,"pushup","r"],["Pull Up",3,"pullup","r"],["Lari",2,"lari","t"],["Boxing",3,"boxing","r"],["Berenang",1,"swim","t"],["Jalan Kaki",0,"walk","t"]];
const KEY="target-olahraga-v1";
let S={user:null,plans:[],logs:[],rewards:[]},tab="home";
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const xp=()=>S.logs.reduce((a,l)=>a+(l.xp!=null?l.xp:l.min),0);
const lvl=()=>{let x=xp(),i=0;LV.forEach((l,k)=>{if(x>=l[1])i=k});return i};
function render(){
  const a=$("app");
  if(!S.user){
    a.innerHTML=`<h1>⚔ SISTEM HUNTER</h1><div class="mu" style="margin:-8px 0 12px">[Sistem] Pemain baru terdeteksi. Daftarkan identitasmu.</div><div class="card"><h2>Registrasi Hunter</h2>
    <label>Nama</label><input id="n" placeholder="Nama kamu">
    <label>Tinggi badan (cm)</label><input id="t" type="number" inputmode="numeric">
    <label>Berat badan (kg)</label><input id="b" type="number" inputmode="decimal">
    <button onclick="login()">Bangkit</button></div>`;return}
  const u=S.user,i=lvl(),x=xp(),nx=LV[i+1],pr=nx?(x-LV[i][1])/(nx[1]-LV[i][1])*100:100;
  const bmi=(u.b/((u.t/100)**2)).toFixed(1);
  const tabs=[["home","Beranda"],["plan","Latihan"],["rew","Reward"]];
  let h=`<div class="row"><h1>Hunter ${esc(u.n)}</h1><button class="g" onclick="logout()">Keluar</button></div>
  <div class="tabs">${tabs.map(t=>`<button class="${tab==t[0]?"on":""}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join("")}</div>`;
  if(tab=="home"){
    h+=`<div class="card"><span class="tag">RANK ${i+1}/${LV.length}</span><div class="big">${LV[i][0]}</div>
    <div class="bar"><i style="width:${pr}%"></i></div>
    <div class="mu">${x} XP ${nx?`· ${nx[1]-x} XP lagi menuju ${nx[0]}`:"· Rank tertinggi tercapai"}</div>
    <div class="mu">XP = (menit, atau set × repetisi) × bobot intensitas (Ringan 1, Sedang 2, Berat 3, Ekstrem 4)</div></div>
    <div class="card"><h2>Status Hunter</h2><div class="mu">TINGGI ${u.t} cm · BERAT ${u.b} kg · BMI ${bmi}<br>TOTAL QUEST ${S.logs.length} · TOTAL XP ${x}</div>
    <div class="row"><input id="nb" type="number" placeholder="Update berat (kg)"><button onclick="upB()">Simpan</button></div></div>
    <div class="card"><h2>Quest Latihan</h2>
    ${S.plans.length?S.plans.map((p,k)=>`<div class="item"><span class="lft">${im(p.ic)}<span>${esc(p.name)}<div class="mu">${pl(p)} · +${px(p)} XP</div></span></span><button onclick="doLog(${k})">⚔ Selesai</button></div>`).join(""):`<div class="mu">Buat rencana latihan dulu di tab Latihan.</div>`}</div>
    <div class="card"><h2>Log Quest</h2>${S.logs.slice(-5).reverse().map(l=>`<div class="item"><span class="lft">${im(l.ic)}${esc(l.name)}</span><span class="mu">+${l.xp!=null?l.xp:l.min} XP · ${l.d}</span></div>`).join("")||'<div class="mu">Belum ada.</div>'}</div>`;
  }
  if(tab=="plan"){
    h+=`<div class="card"><h2>Tambah latihan</h2>
    <label>Pilih gerakan (atau ketik sendiri di bawah)</label><div class="pg">${PRE.map((x,k)=>`<button class="${selIc==x[2]?"on":""}" onclick="pre(${k})">${im(x[2])}${x[0]}</button>`).join("")}</div>
    <label>Nama latihan</label><input id="pn" placeholder="Lari, push-up, renang...">
    <label>Intensitas (bobot XP per rep / menit)</label><select id="pi">${INT.map((x,k)=>`<option value="${k}">${x[0]} · ×${x[1]} XP/menit</option>`).join("")}</select>
    <label>Cara hitung</label><select id="pt" onchange="tg()"><option value="r">Repetisi × Set</option><option value="t">Durasi (menit)</option></select>
    <div id="dr"><div class="row"><div><label>Set</label><input id="pse" type="number" inputmode="numeric" value="3"></div><div><label>Repetisi per set</label><input id="prp" type="number" inputmode="numeric" value="12"></div></div></div>
    <div id="dt" style="display:none"><label>Durasi (menit)</label><input id="pm" type="number" inputmode="numeric" value="30"></div>
    <label>Target per minggu (kali)</label><input id="pw" type="number" inputmode="numeric" value="3">
    <button onclick="addP()">Tambah</button></div>
    <div class="card"><h2>Rencana saya</h2>${S.plans.map((p,k)=>`<div class="item"><span class="lft">${im(p.ic)}<span>${esc(p.name)}<div class="mu">${pl(p)} · ${p.w}x/minggu<br>${INT[(p.m||1)-1][0]} · +${px(p)} XP per sesi</div></span></span><button class="g" onclick="S.plans.splice(${k},1);save();render()">Hapus</button></div>`).join("")||'<div class="mu">Belum ada.</div>'}</div>
    <div class="card"><h2>Jenjang Rank</h2>${LV.map((l,k)=>`<div class="item ${k>i?"off":""}"><span>${l[0]}</span><span class="mu">${l[1]} XP</span></div>`).join("")}</div>`;
  }
  if(tab=="rew"){
    h+=`<div class="card"><h2>Buat Reward</h2>
    <label>Hadiah</label><input id="rt" placeholder="Contoh: Sepatu baru, makan enak">
    <label>Didapat saat mencapai</label><select id="rl">${LV.map((l,k)=>`<option value="${k}">${l[0]}</option>`).join("")}</select>
    <button onclick="addR()">Simpan hadiah</button></div>
    <div class="card"><h2>Reward Hunter</h2>${S.rewards.map((r,k)=>{const ok=i>=r.l;return `<div class="item"><span>${r.got?"✅ ":ok?"🎁 ":"🔒 "}${esc(r.t)}<div class="mu">Syarat: ${LV[r.l][0]}</div></div>${r.got?'<span class="mu">Diambil</span>':ok?`<button onclick="S.rewards[${k}].got=1;save();render()">Klaim!</button>`:'<span class="mu">Terkunci</span>'}</div>`}).join("")||'<div class="mu">Belum ada.</div>'}</div>`;
  }
  a.innerHTML=h;
}
function login(){const n=$("n").value.trim(),t=+$("t").value,b=+$("b").value;
  if(!n||t<50||b<10){alert("Isi nama, tinggi, dan berat dengan benar.");return}
  S.user={n,t,b};save();render()}
function logout(){if(confirm("Keluar? Data tetap tersimpan di perangkat ini.")){S.user=null;render()}}
function upB(){const v=+$("nb").value;if(v>10){S.user.b=v;save();render()}}
function tg(){const t=$("pt").value;$("dr").style.display=t=="r"?"":"none";$("dt").style.display=t=="t"?"":"none"}
function pre(k){const x=PRE[k];selIc=x[2];$("pt").value=x[3];tg();$("pn").value=x[0];$("pi").value=x[1];document.querySelectorAll(".pg button").forEach((b,i)=>b.classList.toggle("on",i==k))}
function addP(){const name=$("pn").value.trim(),t=$("pt").value,min=+$("pm").value,sets=+$("pse").value,reps=+$("prp").value,w=+$("pw").value,m=+$("pi").value+1;if(!name||(t=="t"?min<1:(sets<1||reps<1)))return;S.plans.push({name,t,min,sets,reps,w,m,ic:selIc});selIc="";save();render()}
function doLog(k){const p=S.plans[k],b=lvl();S.logs.push({name:p.name,min:p.min||0,xp:px(p),ic:p.ic,d:new Date().toLocaleDateString("id-ID")});save();render();if(lvl()>b)alert("[SISTEM] Rank naik! Kamu sekarang "+LV[lvl()][0]+".")}
function addR(){const t=$("rt").value.trim();if(!t)return;S.rewards.push({t,l:+$("rl").value,got:0});save();render()}
render();
</script></body></html>
